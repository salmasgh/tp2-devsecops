name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    name: Build & tests unitaires
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installation des dépendances
        run: pip install -r requirements.txt pytest httpx

      - name: Compilation (vérification syntaxique)
        run: python -m compileall -q main.py tests

      - name: Tests unitaires (pytest)
        run: pytest -v

      - name: Build de l'image Docker
        run: docker build -t tp2-app:ci .
